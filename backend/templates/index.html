{% extends 'base.html' %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">Bem-vindo ao Sistema</h1>
        <p class="col-md-8 fs-4">Você está logado no sistema.</p>
        <hr class="my-4">
        <p>Usuário logado: <strong>{{ user.username }}</strong></p>
        <a class="btn btn-primary btn-lg" href="{% url 'logout' %}" role="button">Sair do Sistema</a>
    </div>
</div>
{% endblock %}
